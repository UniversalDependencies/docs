<!-- Support for accordion user interface on the home page. -->
<noscript><style>
  /* Without JavaScript, show all panels (css/style.css hides them by default). */
  .jquery-ui-accordion .ui-accordion-content { display: block; }
</style></noscript>
<script type="text/javascript">
    // vanilla JS accordion over the statically rendered markup in at_glance*.html.
    // Panels are just display toggled and size themselves to their content vertically.
    (function() {
        var setClass = function(el, cls, on) {
            if (on) el.classList.add(cls);
            else el.classList.remove(cls);
        };

        var setup = function() {
            var panelOf = function(header) {
                var el = header.nextElementSibling;
                while (el && !el.classList.contains('ui-accordion-content')) {
                    if (el.classList.contains('ui-accordion-header')) return null;
                    el = el.nextElementSibling;
                }
                return el;
            };

            var setOpen = function(header, open) {
                var panel = panelOf(header);
                if (!panel) return;
                setClass(header, 'ui-state-active', open);
                setClass(header, 'ui-state-default', !open);
                setClass(header, 'ui-corner-top', open);
                setClass(header, 'ui-corner-all', !open);
                header.setAttribute('aria-expanded', open ? 'true' : 'false');
                var icon = header.querySelector('.ui-accordion-header-icon');
                if (icon) {
                    setClass(icon, 'ui-icon-triangle-1-s', open);
                    setClass(icon, 'ui-icon-triangle-1-e', !open);
                }
                setClass(panel, 'ui-accordion-content-active', open);
                panel.style.display = open ? 'block' : '';
            };

            var toggle = function(header) {
                var wasOpen = header.classList.contains('ui-state-active');
                // One open panel at a time within each accordion.
                var siblings = header.parentElement.children;
                for (var i = 0; i < siblings.length; i++) {
                    if (siblings[i].classList.contains('ui-accordion-header')
                            && siblings[i].classList.contains('ui-state-active')) {
                        setOpen(siblings[i], false);
                    }
                }
                if (!wasOpen) setOpen(header, true);
            };

            var headerFor = function(target, container) {
                // Nearest enclosing header that is a direct child of container;
                // events inside nested subaccordions are left to their own listener.
                for (var el = target; el && el !== container; el = el.parentElement) {
                    if (el.classList.contains('ui-accordion-header')) {
                        return el.parentElement === container ? el : null;
                    }
                }
                return null;
            };

            var onActivate = function(e) {
                var header = headerFor(e.target, e.currentTarget);
                if (header) {
                    if (e.type === 'keydown') e.preventDefault();
                    toggle(header);
                }
            };

            var containers = document.querySelectorAll('.jquery-ui-accordion, .jquery-ui-subaccordion-closed');
            for (var c = 0; c < containers.length; c++) {
                var cls = ['ui-accordion', 'ui-widget', 'ui-helper-reset', 'ui-accordion-icons'];
                for (var k = 0; k < cls.length; k++) containers[c].classList.add(cls[k]);
                containers[c].removeAttribute('role'); // pre-rendered "tablist" no longer applies
                containers[c].addEventListener('click', onActivate);
                containers[c].addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') onActivate(e);
                });
            }

            // Per header: add the open/closed triangle icon, make it
            // keyboard-focusable, rewrite the pre-rendered tab/tabpanel roles
            // as a disclosure pattern (button + labelled region), and drop the
            // pre-rendered inline panel height so panels size to their content.
            var headers = document.querySelectorAll('.jquery-ui-accordion .ui-accordion-header');
            for (var h = 0; h < headers.length; h++) {
                var header = headers[h];
                var icon = document.createElement('span');
                icon.className = 'ui-accordion-header-icon ui-icon ui-icon-triangle-1-e';
                icon.setAttribute('aria-hidden', 'true');
                header.insertBefore(icon, header.firstChild);
                header.setAttribute('tabindex', '0');
                header.setAttribute('role', 'button');
                header.setAttribute('aria-expanded', 'false');
                header.removeAttribute('aria-selected');
                if (!header.id) header.id = 'accordion-header-' + h;
                var panel = panelOf(header);
                if (panel) {
                    panel.style.height = '';
                    panel.setAttribute('role', 'region');
                    if (!panel.id) panel.id = 'accordion-panel-' + h;
                    header.setAttribute('aria-controls', panel.id);
                    panel.setAttribute('aria-labelledby', header.id);
                }
            }
        };

        // This include sits below the accordion markup, so setup runs immediately
        // during parse rather than waiting for DOMContentLoaded (which deferred
        // external scripts would delay).
        if (document.querySelector('.jquery-ui-accordion')) {
            setup();
        } else if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setup);
        }
    })();
</script>
